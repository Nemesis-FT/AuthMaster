version: "1"

volumes:
  db:

services:
  db:
    # Pin the major version: the data volume can only be opened by the major version that created it.
    # Upgrading requires a dump/restore or pg_upgrade (and since 18, mounting /var/lib/postgresql instead).
    image: postgres:16
    environment:
      POSTGRES_USER: "authmaster"
      POSTGRES_PASSWORD: "authmaster"
      POSTGRES_DB: "authmaster"
    volumes:
      - "db:/var/lib/postgresql/data"
    restart: always
  backend:
    image: "nemesisryg/authmaster:latest"
    environment:
      AUTHLIB_INSECURE_TRANSPORT: 1
      DB_URI: "postgresql://authmaster:authmaster@db/authmaster"
      PYTHONUNBUFFERED: 1
      RECOVERY_SECS: 300
      # Browser origins allowed to exchange codes at /oauth/token, comma-separated (e.g. Codex's Swagger UI).
      CORS_ALLOWED_ORIGINS: "http://localhost:8081"
      SECRET_KEY: "secret"
      SENDINBLUE_KEY: "???"
    ports:
      - "8000:80"
    depends_on:
      - db
    restart: always